packages:
  - 'packages/*'
  - 'examples/*'
  - 'website'

# Shared version ranges for dependencies used by three or more workspace
# packages. Reference an entry from a package.json with "catalog:".
# `pnpm pack` / `pnpm publish` (and Changesets, which publishes through pnpm)
# replace "catalog:" with the range below, so published manifests keep
# concrete ranges. Dependabot updates these entries in place.
# create-starknet-agent also writes some of these ranges into the projects it
# generates; its build reads them from here (see
# packages/create-starknet-agent/src/template-dependencies.ts).
catalog:
  '@modelcontextprotocol/sdk': ^1.31.0
  '@types/node': ^26.6.3
  dotenv: ^18.0.4
  starknet: ^10.8.0
  tsup: ^8.5.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.2
  zod: ^4.6.5
