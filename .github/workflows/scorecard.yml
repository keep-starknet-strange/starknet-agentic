name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '25 5 * * 1'
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.37.7 (tag object: faaa5d804fc648d0fdb28822a8e36cf7d0a6132c)
        with:
          sarif_file: results.sarif
