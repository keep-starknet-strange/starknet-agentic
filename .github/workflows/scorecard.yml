name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '25 5 * * 1'
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.35.2 (tag object: 7fc6561ed893d15cec696e062df840b21db27eb0)
        with:
          sarif_file: results.sarif
