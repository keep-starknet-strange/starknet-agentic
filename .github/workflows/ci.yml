name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      # JSON array of contracts/<dir> names to build and test, e.g. ["agent-account"].
      cairo-contracts: ${{ steps.cairo-filter.outputs.changes }}
      website: ${{ steps.filter.outputs.website }}
      skills: ${{ steps.filter.outputs.skills }}
      onboarding: ${{ steps.filter.outputs.onboarding }}
      scaffolder: ${{ steps.filter.outputs.scaffolder }}
      contract-scripts: ${{ steps.filter.outputs.contract-scripts }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'packages/**'
              - 'examples/**'
              - 'spec/**'
              - 'scripts/security/**'
              - 'security/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - 'eslint.config.mjs'
            website:
              - 'website/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            skills:
              - '.agents/**'
              - 'SKILL.md'
              - 'requirements.txt'
              - 'README.md'
              - 'LICENSE'
              - 'SECURITY.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - 'skills/**'
              - 'scripts/quality/README.md'
              - 'scripts/quality/validate_marketplace.py'
              - 'scripts/quality/parity_check.py'
              - 'scripts/quality/check_codex_distribution.py'
              - 'scripts/quality/test_codex_distribution.py'
              - 'scripts/quality/check_cairo_auditor_release_hygiene.py'
              - 'scripts/quality/test_cairo_auditor_release_hygiene.py'
              - 'scripts/quality/validate_skills.py'
              - 'scripts/quality/test_validate_skills.py'
              - 'scripts/quick_validate_skill.py'
              - 'scripts/skills_manifest.py'
              - '.claude-plugin/**'
            onboarding:
              - 'examples/onboard-agent/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # create-starknet-agent writes catalog versions into generated
            # projects at build time, so catalog bumps re-run its check too.
            scaffolder:
              - 'packages/create-starknet-agent/**'
              - 'packages/shared/**'
              - 'packages/starknet-mcp-server/package.json'
              - 'pnpm-workspace.yaml'
            contract-scripts:
              - 'contracts/*/scripts/*.js'
              - 'contracts/eslint.scripts.config.mjs'
            ci:
              - '.github/workflows/ci.yml'
      # One filter per Scarb project under contracts/. Filter names must equal the
      # directory names: the `changes` output becomes the Cairo job's matrix.
      # Editing this workflow runs every contract.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: cairo-filter
        with:
          filters: |
            erc8004-cairo:
              - 'contracts/erc8004-cairo/**'
              - '.github/workflows/ci.yml'
            agent-account:
              - 'contracts/agent-account/**'
              - '.github/workflows/ci.yml'
            huginn-registry:
              - 'contracts/huginn-registry/**'
              - '.github/workflows/ci.yml'
            session-account:
              - 'contracts/session-account/**'
              - '.github/workflows/ci.yml'

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan the working tree (not git history) to avoid blocking on legacy leaks while still
      # preventing new secrets from being introduced via PRs.
      - name: Scan repository for secrets (working tree)
        run: |
          set -euo pipefail
          gitleaks detect --source . --no-git --redact --exit-code 1 --config .gitleaks.toml

  typecheck:
    name: Type Check
    needs: [detect-changes]
    if: needs.detect-changes.outputs.ts == 'true' || needs.detect-changes.outputs.website == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Package builds use `tsc --noCheck` (declarations only), so they do not
      # type-check. They are still needed: dependents resolve workspace
      # packages through the emitted dist/*.d.ts.
      - name: Build workspace packages
        run: pnpm -r --filter './packages/*' build

      # Runs `tsc --noEmit` in every package, example and the website that
      # defines a `typecheck` script.
      - name: Type check
        run: pnpm -r --if-present typecheck

  lint:
    name: Lint
    needs: [detect-changes]
    if: needs.detect-changes.outputs.ts == 'true' || needs.detect-changes.outputs.website == 'true' || needs.detect-changes.outputs.contract-scripts == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Packages and examples use the root eslint.config.mjs; the website uses
      # website/eslint.config.mjs.
      - name: Lint
        run: pnpm -r --if-present lint

      # contracts/*/scripts/ sit outside the pnpm workspace and never run in
      # CI, so an undefined helper would only surface at deploy time (#622).
      - name: Check contract deploy scripts for undefined identifiers
        run: pnpm exec eslint -c contracts/eslint.scripts.config.mjs 'contracts/*/scripts/*.js'

  test:
    name: Test
    needs: [detect-changes]
    if: needs.detect-changes.outputs.ts == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Audit dependencies (report)
        run: |
          set -euo pipefail
          pnpm audit --json > audit-report.json || true

      - name: Enforce audit allowlist (high+)
        run: |
          set -euo pipefail
          node scripts/security/audit-gate.mjs --report audit-report.json --allowlist security/audit-allowlist.json --failLevel high

      - name: Run security script unit tests
        run: |
          set -euo pipefail
          node --test scripts/security/check-session-signature-parity.test.mjs
          node --test scripts/security/verify-secure-defi-claims.test.mjs
          node --test scripts/security/evidence-manifest.test.mjs
          node --test scripts/security/spending-policy-evidence.test.mjs

      - name: Build packages
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

  cairo:
    # GitHub appends the matrix value, e.g. "Cairo (agent-account)".
    name: Cairo
    needs: [detect-changes]
    if: needs.detect-changes.outputs.cairo-contracts != '' && needs.detect-changes.outputs.cairo-contracts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract: ${{ fromJSON(needs.detect-changes.outputs.cairo-contracts) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.14.0"

      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.64.0"

      - name: Build contracts
        working-directory: contracts/${{ matrix.contract }}
        run: scarb build

      - name: Run Cairo tests
        working-directory: contracts/${{ matrix.contract }}
        run: snforge test

  website-build:
    name: Website Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.website == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build website
        working-directory: website
        run: pnpm run build

  validate-skills:
    name: Validate Skills
    needs: [detect-changes]
    if: needs.detect-changes.outputs.skills == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          scarb-version: "2.14.0"

      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e # v6.0.0
        with:
          starknet-foundry-version: "0.64.0"

      - name: Install Python deps
        run: |
          python3 -m pip install --require-hashes -r requirements-lock.txt

      - name: Validate skill validator regression tests
        run: |
          python3 -m unittest scripts/quality/test_validate_skills.py
          python3 -m unittest scripts/quality/test_parity_check.py
          python3 -m unittest scripts/quality/test_codex_distribution.py
          python3 -m unittest scripts/quality/test_cairo_auditor_release_hygiene.py
          python3 -m unittest scripts/quality/test_sync_cairo_auditor_release.py

      - name: Validate skill contracts
        run: |
          echo "Validating repository SKILL.md contracts..."
          python3 scripts/quality/validate_skills.py
          echo "All skills validated successfully!"

      - name: Cairo-auditor fixture smoke gates
        run: |
          python3 skills/cairo-auditor/tests/validate_preflight.py
          python3 skills/cairo-auditor/tests/validate_deep_smoke.py

      - name: Validate skills manifest
        run: |
          echo "Validating skills/manifest.json..."
          python3 scripts/skills_manifest.py --check
          echo "skills/manifest.json: OK"

      - name: Validate plugin and marketplace metadata
        run: |
          echo "Validating plugin + marketplace parity and skill paths..."
          python3 scripts/quality/validate_marketplace.py
          echo "Plugin metadata validation: OK"

      - name: Run skill parity checks
        run: |
          python3 scripts/quality/parity_check.py

      - name: Validate Codex skill distribution surface
        run: |
          python3 scripts/quality/check_codex_distribution.py

      - name: Validate cairo-auditor release hygiene (when VERSION changes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA for diff; release hygiene gate skipped."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Base SHA missing locally, attempting fetch: $BASE_SHA"
            if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              echo "Unable to fetch base SHA; release hygiene gate skipped."
              exit 0
            fi
          fi
          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qx 'skills/cairo-auditor/VERSION'; then
            python3 scripts/quality/check_cairo_auditor_release_hygiene.py --enforce
          else
            echo "skills/cairo-auditor/VERSION unchanged; release hygiene gate skipped."
          fi

  onboarding-smoke:
    name: Onboarding Smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.onboarding == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      - name: Install onboarding example dependencies
        run: pnpm --dir examples/onboard-agent install --frozen-lockfile

      - name: Build shared workspace package
        run: pnpm --filter @starknetfoundation/starknet-agentic-shared build

      - name: Run onboarding smoke checks
        run: pnpm --dir examples/onboard-agent smoke

  generated-projects:
    name: Generated Projects
    needs: [detect-changes]
    if: needs.detect-changes.outputs.scaffolder == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build create-starknet-agent
        run: pnpm --filter @starknetfoundation/create-starknet-agent build

      - name: Scaffold and type-check every template
        run: pnpm --filter @starknetfoundation/create-starknet-agent check:generated

  scaffolder-windows:
    name: Scaffolder Windows Spawn
    needs: [detect-changes]
    if: needs.detect-changes.outputs.scaffolder == 'true' || needs.detect-changes.outputs.ci == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # verify launches the MCP server through npx.cmd on Windows; check that
      # arguments survive cmd.exe and .cmd shims unchanged.
      - name: Argument round-trip through cmd.exe and .cmd shims
        run: pnpm --filter @starknetfoundation/create-starknet-agent exec vitest run src/__tests__/spawn-args.test.ts

  all-checks:
    name: All Checks Passed
    if: always()
    runs-on: ubuntu-latest
    needs: [detect-changes, secret-scan, typecheck, lint, test, cairo, website-build, validate-skills, onboarding-smoke, generated-projects, scaffolder-windows]
    steps:
      - name: Verify no failures
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "Change detection failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI checks passed!"
